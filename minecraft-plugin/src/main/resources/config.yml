# Адрес проекта Supabase БЕЗ завершающего слэша, например https://abcdefgh.supabase.co
supabase-url: ""
# Публичный anon-ключ (тот же, что в .env сайта: VITE_SUPABASE_ANON_KEY). Это не секрет.
supabase-anon-key: ""
# СЕКРЕТ плагина (минимум 32 символа). Его хэш внесён в таблицу minecraft_plugin_keys (см. README).
# Никогда не публикуйте этот файл и не копируйте секрет на сайт.
plugin-secret: ""
# Проверка имеет смысл только на сервере с лицензионной авторизацией (online-mode=true).
# На «пиратском» сервере любой может зайти под чужим ником, и подтверждение ничего не докажет.
require-online-mode: true
# Пауза между попытками одного игрока, секунды.
cooldown-seconds: 5
